# What the Claude Managed Agent monitors every week (read from the mounted repository at run time,
# so editing this file on `main` changes the next run without re-deploying anything).
#
# The agent overrides output_dir and database at run time:
#   --output-dir /mnt/session/outputs/pipeline   --database /mnt/memory/discovery-memory/state
language: lt            # report language: lt | en
cache_ttl_hours: 12
scoring:
  min_evidence: 0.25

watches:
  - name: ipf
    disease: idiopathic pulmonary fibrosis
    top_k: 8
    candidates: 200
    enrich_k: 15
    score_change_threshold: 0.05

  - name: als
    disease: amyotrophic lateral sclerosis
    top_k: 8
    candidates: 200
    enrich_k: 15
    score_change_threshold: 0.05
